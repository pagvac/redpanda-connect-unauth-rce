<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="CVE-2026-123270 Redpanda Connect RCE banner wordmark">
  <defs>
    <linearGradient id="bg03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061009"/>
      <stop offset="1" stop-color="#020805"/>
    </linearGradient>
    <linearGradient id="strip03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08190f"/>
      <stop offset="1" stop-color="#040d08"/>
    </linearGradient>
    <pattern id="scan03" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#5dffa6" opacity="0.05"/>
    </pattern>
    <clipPath id="strip03clip"><rect x="80" y="470" width="1120" height="190" rx="18"/></clipPath>
  </defs>

  <rect width="1280" height="720" rx="32" fill="url(#bg03)"/>
  <!-- subtle frame -->
  <rect x="24" y="24" width="1232" height="672" rx="28" fill="none" stroke="#14623c" stroke-width="2"/>

  <!-- top caption -->
  <g font-family="Courier New, Courier, monospace">
    <rect x="80" y="104" width="64" height="5" fill="#5dffa6"/>
    <text x="156" y="118" font-size="20" letter-spacing="5" fill="#8affc4">SECURITY ADVISORY</text>

    <!-- wordmark -->
    <text x="78" y="212" font-size="64" font-weight="bold" letter-spacing="1" fill="#5dffa6">CVE-2026-123270</text>
    <text x="78" y="300" font-size="48" fill="#eaffee">Redpanda Connect <tspan fill="#8affc4">&#183;</tspan> <tspan fill="#eaffee">RCE</tspan></text>

    <text x="80" y="372" font-size="22" fill="#2e9c63">Unauthenticated RCE &#183; streams management API &#183; 0.0.0.0:4195</text>
  </g>

  <!-- slim terminal strip -->
  <rect x="72" y="462" width="1136" height="206" rx="24" fill="#0c3f26"/>
  <rect x="80" y="470" width="1120" height="190" rx="18" fill="url(#strip03)"/>
  <g clip-path="url(#strip03clip)">
    <rect x="80" y="470" width="1120" height="40" fill="#0a2417"/>
    <circle cx="108" cy="490" r="6" fill="#2e9c63"/>
    <circle cx="128" cy="490" r="6" fill="#1e7f4e"/>
    <circle cx="148" cy="490" r="6" fill="#14623c"/>
    <text x="1184" y="496" text-anchor="end" font-family="Courier New, Courier, monospace" font-size="15" fill="#8affc4">in-band exploit &#183; 2&#215; POST</text>

    <g font-family="Courier New, Courier, monospace">
      <text x="112" y="560" font-size="24"><tspan fill="#8affc4">$</tspan> <tspan fill="#eaffee">POST</tspan> <tspan fill="#5dffa6">:4195/streams/x</tspan>   <tspan fill="#2e9c63">(sh -c id, sync_response)</tspan></text>
      <text x="112" y="602" font-size="24"><tspan fill="#8affc4">$</tspan> <tspan fill="#eaffee">POST</tspan> <tspan fill="#5dffa6">:4195/x/trigger</tspan>   <tspan fill="#eaffee">&#8617; uid=1000 gid=1000</tspan>  <tspan fill="#5dffa6">_</tspan></text>
    </g>
    <rect x="80" y="470" width="1120" height="190" fill="url(#scan03)"/>
  </g>
</svg>
