<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="CRT terminal advisory logo">
  <defs>
    <radialGradient id="g1crt" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0b1f12"/>
      <stop offset="100%" stop-color="#030806"/>
    </radialGradient>
    <linearGradient id="g1scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06120b"/>
      <stop offset="100%" stop-color="#020604"/>
    </linearGradient>
    <filter id="g1glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="g1clip"><rect x="30" y="34" width="196" height="150" rx="10"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="22" fill="url(#g1crt)"/>
  <rect x="20" y="24" width="216" height="170" rx="16" fill="#071009" stroke="#1e7f4e" stroke-width="2"/>
  <rect x="30" y="34" width="196" height="150" rx="10" fill="url(#g1scr)"/>
  <g clip-path="url(#g1clip)">
    <g opacity="0.07" fill="#4dff9e">
      <rect x="30" y="38" width="196" height="2"/><rect x="30" y="46" width="196" height="2"/>
      <rect x="30" y="54" width="196" height="2"/><rect x="30" y="62" width="196" height="2"/>
      <rect x="30" y="70" width="196" height="2"/><rect x="30" y="78" width="196" height="2"/>
      <rect x="30" y="86" width="196" height="2"/><rect x="30" y="94" width="196" height="2"/>
      <rect x="30" y="102" width="196" height="2"/><rect x="30" y="110" width="196" height="2"/>
      <rect x="30" y="118" width="196" height="2"/><rect x="30" y="126" width="196" height="2"/>
      <rect x="30" y="134" width="196" height="2"/><rect x="30" y="142" width="196" height="2"/>
      <rect x="30" y="150" width="196" height="2"/><rect x="30" y="158" width="196" height="2"/>
      <rect x="30" y="166" width="196" height="2"/><rect x="30" y="174" width="196" height="2"/>
    </g>
    <g font-family="'Courier New',monospace" font-weight="bold" filter="url(#g1glow)">
      <text x="42" y="58" font-size="13" fill="#5dffa6">$ POST :4195/streams/x</text>
      <text x="42" y="80" font-size="13" fill="#8affc4">&#8627; command: sh -c id</text>
      <text x="42" y="106" font-size="13" fill="#5dffa6">$ POST :4195/x/trigger</text>
      <text x="42" y="130" font-size="13" fill="#eaffee">&#8627; uid=1000 gid=1000</text>
      <text x="42" y="158" font-size="13" fill="#5dffa6">$ <tspan fill="#eaffee">_</tspan></text>
    </g>
  </g>
  <text x="128" y="216" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="15" fill="#4dff9e" letter-spacing="2">CVE-2026-123270</text>
  <text x="128" y="236" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#2e9c63" letter-spacing="3">UNAUTH · RCE</text>
</svg>
